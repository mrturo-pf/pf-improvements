name: Improvement metadata validation

on:
  pull_request:
    paths:
      - "improvements.json"
      - "scripts/validate-improvements.py"
      - ".github/workflows/improvement-validation.yml"
      - ".github/ISSUE_TEMPLATE/improvement.md"
  push:
    branches: [main]
    paths:
      - "improvements.json"
      - "scripts/validate-improvements.py"
      - ".github/workflows/improvement-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Improvement metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate manifest and generate context
        run: python3 scripts/validate-improvements.py --write-generated
      - name: Check generated output
        run: git diff --exit-code -- generated
      - name: Upload generated context
        uses: actions/upload-artifact@v4
        with:
          name: improvement-context
          path: generated/
          if-no-files-found: error
